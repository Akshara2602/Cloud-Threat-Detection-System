
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cloud Security Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/style.css') }}">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>🛡️ Cloud Security</h1>

            <p>Threat Detection and Alert System</p>

            <form method="POST" action="/login">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            {% if error %}

                <p class="error">{{ error }}</p>

            {% endif %}

        </div>

    </div>

</body>

</html>
